version: "3.9"

services:

  postgres:
    image: postgres:16

    container_name: researchai_postgres

    restart: unless-stopped

    environment:
      POSTGRES_DB: researchai
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: